<!doctype html>
<!-- Carga index.html real dentro de un iframe con un Supabase falso; ver tests/run.mjs -->
<meta charset="utf-8" />
<pre id="out">pending</pre>
<iframe id="app" style="width:1280px;height:900px" src="../index.html?test=1"></iframe>
<script src="mock-supabase.js"></script>
<script src="scenarios.js"></script>
<script>
  const frame = document.querySelector("#app");
  const scenarioName = new URLSearchParams(location.search).get("s");
  const results = [];
  // Con --virtual-time-budget el reloj virtual corre más rápido que el trabajo asíncrono real (decodificar o codificar imágenes).
  // Una petición real al servidor local pausa el tiempo virtual y deja avanzar ese trabajo.
  const realTick = () => fetch("/tests/ping", { cache: "no-store" }).catch(() => {});
  const wait = async (ms) => { await new Promise((resolve) => setTimeout(resolve, ms)); await realTick(); };
  async function until(test, label, tries = 300) {
    for (let i = 0; i < tries; i++) { if (test()) return; await wait(50); }
    throw new Error(`timeout: ${label}`);
  }
  async function main() {
    const scenario = window.SCENARIOS[scenarioName];
    const log = [];
    const db = scenario.db();
    // El iframe se crea antes de inyectar el cliente falso: se sustituye el SDK antes de que corran los scripts de la app.
    frame.src = "about:blank";
    await wait(10);
    const doc = frame.contentDocument;
    const html = await (await fetch("../index.html")).text();
    const patched = html
      .replace(/<script src="https:\/\/cdn[^"]*"><\/script>/, "")
      .replace(/<link[^>]*https:\/\/[^>]*>/g, "") // sin red externa (fuentes): las pruebas no dependen de internet
      .replace(/<script src="supabase-config.js"><\/script>/, "")
      .replaceAll(/src="(?!http)([^"]+\.js)"/g, 'src="../$1"')
      .replace('href="styles.css"', 'href="../styles.css"')
      .replace("</head>", `<script>
        window.VENTUREA_CONFIG = { supabaseUrl: "https://x.supabase.co", supabaseAnonKey: "k" };
        window.supabase = { createClient: () => parent.__client };
      <\/script></head>`);
    window.__client = window.createMockSupabase(db, { ...scenario.options, log });
    doc.open();
    // Los console.error de la app cuentan como fallo: así no pasan inadvertidos errores tragados por catch.
    frame.contentWindow.console.error = (...args) => results.push({ ok: false, label: "console.error: " + args.map((a) => (a && a.message) || String(a)).join(" ") });
    frame.contentWindow.addEventListener("error", (e) => results.push({ ok: false, label: "error: " + e.message }));
    frame.contentWindow.addEventListener("unhandledrejection", (e) => results.push({ ok: false, label: "rechazo sin manejar: " + ((e.reason && e.reason.message) || e.reason) }));
    doc.write(patched); doc.close();
    const ctx = {
      doc, win: frame.contentWindow, db, log, wait, until,
      $: (s) => doc.querySelector(s), $$: (s) => [...doc.querySelectorAll(s)],
      ok(cond, label) { results.push({ ok: !!cond, label }); },
      visible(el) { return !!el && !el.hidden && el.getClientRects().length > 0; }
    };
    await until(() => doc.readyState === "complete" && typeof frame.contentWindow.initializeSupabaseApp === "function", "carga de scripts", 400);
    await scenario.run(ctx);
  }
  main().catch((e) => {
    const d = frame.contentDocument;
    const read = (s) => (d.querySelector(s) || {}).textContent || "";
    results.push({ ok: false, label: `EXCEPCIÓN: ${e.message} [aviso: ${read("#toast")} | acceso: ${read("#auth-error")} | error imagen: ${read("#image-error")}]` });
  }).finally(() => {
    document.querySelector("#out").textContent = "RESULT:" + JSON.stringify(results) + ":END";
  });
</script>
